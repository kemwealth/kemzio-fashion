<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Wear Beauty statement hoodie</title>
  <desc id="desc">A clean neutral hoodie with the words WEAR BEAUTY printed on the front.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1eee5"/>
      <stop offset="1" stop-color="#d5d1c5"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ec"/>
      <stop offset="1" stop-color="#c9c6bb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="760" fill="url(#background)"/>
  <circle cx="1140" cy="135" r="92" fill="#fff8da" opacity=".7"/>
  <path d="M0 630 Q300 550 570 625 T1050 605 T1400 590 V760 H0Z" fill="#b9c9bc" opacity=".58"/>
  <text x="70" y="85" fill="#29342e" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5">KEMZIO / STATEMENT SERIES</text>
  <g filter="url(#shadow)">
    <path d="M530 145 Q700 215 870 145 L1070 235 L1190 420 L1050 480 L985 385 L985 655 Q700 745 415 655 L415 385 L350 480 L210 420 L330 235Z" fill="url(#hoodie)"/>
    <path d="M530 145 Q700 235 870 145 L815 80 Q700 130 585 80Z" fill="#d7d3c9"/>
    <path d="M585 80 Q700 135 815 80" fill="none" stroke="#b3afa5" stroke-width="9"/>
    <path d="M415 385 L350 480 M985 385 L1050 480" stroke="#aaa79e" stroke-width="7"/>
    <path d="M540 600 Q700 630 860 600" fill="none" stroke="#b2afa6" stroke-width="8"/>
    <path d="M625 280 L775 280 L755 345 L645 345Z" fill="#ece9df" opacity=".75"/>
    <text x="700" y="438" text-anchor="middle" fill="#26352e" font-family="Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="7">WEAR</text>
    <text x="700" y="510" text-anchor="middle" fill="#d86a4b" font-family="Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="3">BEAUTY</text>
  </g>
  <text x="70" y="705" fill="#29342e" font-family="Arial, sans-serif" font-size="19" letter-spacing="4">A QUIET STATEMENT / KEMZIO FASHION</text>
</svg>
