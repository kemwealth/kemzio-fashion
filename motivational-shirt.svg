<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">KemZio motivational printed shirt</title>
  <desc id="desc">A black printed shirt with bright orange and cream JUST DO IT lettering.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d7b4"/>
      <stop offset="1" stop-color="#e97754"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29312d"/>
      <stop offset="1" stop-color="#0e1614"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="22"/>
      <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="900" fill="url(#background)"/>
  <circle cx="735" cy="145" r="106" fill="#f9efb7" opacity=".7"/>
  <path d="M0 760 Q190 665 370 735 T900 700 V900 H0Z" fill="#f7b978" opacity=".7"/>
  <path d="M75 120 H265" stroke="#27302c" stroke-width="4"/>
  <text x="75" y="105" fill="#27302c" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="4">KEMZIO / DAILY UNIFORM</text>
  <g filter="url(#shadow)">
    <path d="M328 205 L188 278 L245 430 L310 388 L310 705 Q450 770 590 705 L590 388 L655 430 L712 278 L572 205 L510 255 Q450 285 390 255Z" fill="url(#shirt)"/>
    <path d="M390 255 Q450 300 510 255" fill="none" stroke="#54605a" stroke-width="10"/>
    <path d="M245 430 L310 388 M655 430 L590 388" stroke="#54605a" stroke-width="6" opacity=".65"/>
    <text x="450" y="430" text-anchor="middle" fill="#ff724f" font-family="Arial, sans-serif" font-size="75" font-weight="900" letter-spacing="-3">JUST</text>
    <text x="450" y="505" text-anchor="middle" fill="#ffedb2" font-family="Arial, sans-serif" font-size="75" font-weight="900" letter-spacing="-3">DO IT</text>
    <path d="M365 540 H535" stroke="#ff724f" stroke-width="7"/>
    <text x="450" y="575" text-anchor="middle" fill="#ffedb2" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="5">KEMZIO FASHION</text>
  </g>
  <text x="75" y="835" fill="#27302c" font-family="Arial, sans-serif" font-size="20" letter-spacing="3">WEAR THE WORK / MAKE YOUR MARK</text>
</svg>
